name: NovaLab Studios Launcher v0.10 Windows / Rust
on:
  push:
    branches: [main]
    paths:
      - 'launcher/index.html'
      - 'launcher/desktop/**'
      - 'launcher/native-bridge.js'
      - '.github/workflows/novalab-launcher-windows.yml'
  workflow_dispatch:
concurrency:
  group: novalab-launcher-win-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: launcher/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'launcher/desktop/src-tauri -> target'
      - name: Prepare bundled web application (external scripts for CSP)
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          root=Path('..'); output=Path('dist-web');output.mkdir(parents=True,exist_ok=True)
          html=(root/'index.html').read_text(encoding='utf8')
          css=re.search(r'<style>(.*?)</style>',html,re.S)
          script=re.search(r'<script>(.*?)</script>',html,re.S)
          assert css and script, 'Expected packaged mobile CSS and JS'
          (output/'style.css').write_text(css.group(1),encoding='utf8')
          (output/'app.js').write_text(script.group(1),encoding='utf8')
          (output/'native-bridge.js').write_text((root/'native-bridge.js').read_text(encoding='utf8'),encoding='utf8')
          html=html.replace(css.group(0),'<link rel="stylesheet" href="style.css">',1)
          html=html.replace(script.group(0),'<script src="native-bridge.js"></script><script src="app.js"></script>',1)
          (output/'index.html').write_text(html,encoding='utf8')
          print('Frontend ready; no inline JavaScript, native Tauri bridge added')
          '@ | python -
      - name: Generate NovaLab Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          @'
          from pathlib import Path
          from PIL import Image,ImageDraw
          folder=Path('src-tauri/icons');folder.mkdir(parents=True,exist_ok=True)
          img=Image.new('RGBA',(256,256),(24,10,42,255));d=ImageDraw.Draw(img)
          d.rounded_rectangle((6,6,249,249),radius=60,fill=(46,15,71,255),outline=(219,51,171,255),width=5)
          d.line([(49,195),(84,60),(138,164),(194,56),(215,191)],fill=(250,63,184,255),width=23,joint='curve')
          img.save(folder/'icon.png')
          img.save(folder/'icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund
      - name: Test Rust updater, ZIP integrity and malformed inputs
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Compile NSIS Windows installer
        run: npx tauri build --bundles nsis
      - name: Refuse overwriting any already-published launcher version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = 'https://api.github.com/repos/akraniss05/NovaLab-Website1/releases/tags/novalab-launcher-v0.10-alpha'
          $headers = @{'User-Agent'='NovaLab-Release-Guard';'Authorization'="Bearer $env:GH_TOKEN"}
          $response = Invoke-WebRequest -Uri $url -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) { throw 'Version 0.10 already published: bump version before publishing changes.' }
          if ($response.StatusCode -ne 404) { throw "Release-Prüfung unerwartet fehlgeschlagen: HTTP $($response.StatusCode)" }
          Write-Host 'PASS: v0.10 tag is unused and may be published once'
      - name: Smoke-test Windows upgrade from installed 0.9 to 0.10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'novalab-v09-setup.exe'
          $oldUrl = 'https://github.com/akraniss05/NovaLab-Website1/releases/download/novalab-launcher-v0.9-alpha/NovaLab.Studios.Launcher_0.9.0_x64-setup.exe'
          Invoke-WebRequest -Uri $oldUrl -OutFile $old
          $oldRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/akraniss05/NovaLab-Website1/releases/tags/novalab-launcher-v0.9-alpha' -Headers @{'User-Agent'='NovaLab-Upgrade-QA';'Authorization'="Bearer $env:GH_TOKEN"}
          $previousAsset = $oldRelease.assets | Where-Object { $_.name -eq 'NovaLab.Studios.Launcher_0.9.0_x64-setup.exe' } | Select-Object -First 1
          if (-not $previousAsset -or $previousAsset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Old asset is missing verified release digest' }
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne $previousAsset.digest.Substring(7)) { throw 'Previous release checksum mismatch' }
          $new = (Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1).FullName
          if (-not $new) { throw 'New installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'novalab-upgrade-smoke'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $result = Start-Process -FilePath $old -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "0.9 install failed: $($result.ExitCode)" }
          $exe = Get-ChildItem -Path $installDir -Filter '*.exe' -Recurse | Where-Object {$_.Name -notmatch 'uninstall'} | Select-Object -First 1
          if (-not $exe) { throw '0.9 installation missing executable' }
          $oldHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $result = Start-Process -FilePath $new -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "0.10 upgrade failed: $($result.ExitCode)" }
          $upgradedExe = Get-Item -LiteralPath $exe.FullName
          $newHash = (Get-FileHash $upgradedExe.FullName -Algorithm SHA256).Hash
          if ($newHash -eq $oldHash) { throw 'Installed EXE unchanged after upgrade' }
          Write-Host "PASS: older NSIS install upgraded in-place: $($upgradedExe.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: NovaLab-Studios-v0.10-Windows-Rust
          path: launcher/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novalab-launcher-v0.10-alpha
          name: NovaLab Studios Launcher v0.10 Alpha (Rust/Tauri)
          prerelease: true
          body: |
            NovaLab Studios 0.10.0 – Installer-Sicherheit und Stabilität.
            - Sichere HTTPS-Redirects und begrenzte Downloadgröße.
            - Installationssperre bei parallelen Installationen desselben Spiels.
            - Wiederherstellung bei unterbrochenen Spielupdates und Bereinigung älterer Versionen.
            - Browserstart für HTML-Spiele und Abgleich der installierten Bibliothek.
            - Gezielte Fehlerfall- und Sicherheits-Regressionstests.
          files: launcher/desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
      - name: Validate published release asset integrity metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://api.github.com/repos/akraniss05/NovaLab-Website1/releases/tags/novalab-launcher-v0.10-alpha'
          for ($try = 0; $try -lt 8; $try++) {
            $r = Invoke-RestMethod -Uri $url -Headers @{'User-Agent'='NovaLab-CI';'Authorization'="Bearer $env:GH_TOKEN"}
            $asset = $r.assets | Where-Object {$_.name -eq 'NovaLab.Studios.Launcher_0.10.0_x64-setup.exe'} | Select-Object -First 1
            if ($asset -and $asset.digest -match '^sha256:[0-9a-f]{64}$') { break }
            Start-Sleep -Seconds 3
          }
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Published installer lacks a verified GitHub SHA-256 digest' }
          Write-Host "PASS: published installer has SHA256: $($asset.digest)"
