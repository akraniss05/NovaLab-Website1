name: NovaLab Launcher Windows Setup (Rust Tauri)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/index.html'
      - 'launcher/desktop/**'
      - '.github/workflows/novalab-launcher-windows.yml'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'launcher/desktop/src-tauri -> target'
      - name: Prepare frontend and Windows icons
        shell: bash
        run: |
          mkdir -p dist-web src-tauri/icons
          cp ../index.html dist-web/index.html
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          img=Image.new("RGBA",(256,256),(20,10,37,255))
          d=ImageDraw.Draw(img)
          for i in range(6):
            d.rounded_rectangle((8+i,8+i,247-i,247-i),radius=52,outline=(185,51,169,65+i*12),width=3)
          d.line([(54,193),(90,66),(140,169),(190,65),(213,193)],fill=(255,86,192,255),width=24,joint='curve')
          d.line([(54,193),(90,66),(140,169),(190,65),(213,193)],fill=(255,191,244,255),width=5,joint='curve')
          img.save("src-tauri/icons/icon.png")
          img.save("src-tauri/icons/icon.ico",format="ICO",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS installer
        run: npx tauri build --bundles nsis
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaLab-Launcher-Windows-Rust-v0.3
          path: launcher/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish Windows installer as pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novalab-launcher-v0.3-alpha
          name: NovaLab Studios Launcher v0.3 Alpha (Windows)
          prerelease: true
          files: launcher/desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
