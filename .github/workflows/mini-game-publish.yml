name: NovaLab Mini-Game veröffentlichen

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Ordnername unter launcher/mini-games, z.B. orbit-dash'
        required: true
        type: string
      version:
        description: 'Neue Spielversion, z.B. 1.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-mini-games
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Spieldateien packen, Hash berechnen und Katalog aktualisieren
        run: python launcher/scripts/publish-mini-game.py "$GAME_ID" "$GAME_VERSION"
        env:
          GAME_ID: ${{ inputs.game_id }}
          GAME_VERSION: ${{ inputs.version }}
      - name: Neue Version ins Repository übernehmen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/catalog.json launcher/mini-games/downloads
          if git diff --cached --quiet; then
            echo 'Keine Änderungen vorhanden.'
          else
            git commit -m "Publish mini game $GAME_ID v$GAME_VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        env:
          GAME_ID: ${{ inputs.game_id }}
          GAME_VERSION: ${{ inputs.version }}
