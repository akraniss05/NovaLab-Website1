name: NovaLab Windows In-App Update Release QA
on:
  workflow_run:
    workflows: ["NovaLab Studios Launcher v0.8 Windows / Rust"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-installer-upgrade:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Install released 0.7 and run released 0.8 passive update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-VerifiedReleaseAsset([string]$tag,[string]$filename,[string]$destination) {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/akraniss05/NovaLab-Website1/releases/tags/$tag" -Headers @{'User-Agent'='NovaLab-Update-Smoke';'Authorization'="Bearer $env:GH_TOKEN"}
            $asset = $release.assets | Where-Object { $_.name -eq $filename } | Select-Object -First 1
            if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid release metadata for $tag" }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $destination
            $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $asset.digest.Substring(7)) { throw "Downloaded asset hash mismatch for $tag" }
          }
          $old = Join-Path $env:RUNNER_TEMP 'novalab-v07.exe'
          $new = Join-Path $env:RUNNER_TEMP 'novalab-v08.exe'
          Get-VerifiedReleaseAsset 'novalab-launcher-v0.7-alpha' 'NovaLab.Studios.Launcher_0.7.0_x64-setup.exe' $old
          Get-VerifiedReleaseAsset 'novalab-launcher-v0.8-alpha' 'NovaLab.Studios.Launcher_0.8.0_x64-setup.exe' $new
          $installation = Join-Path $env:RUNNER_TEMP 'novalab-real-upgrade'
          New-Item -ItemType Directory -Path $installation -Force | Out-Null
          $setup = Start-Process -FilePath $old -ArgumentList @('/S',"/D=$installation") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Initial 0.7 installation failed: $($setup.ExitCode)" }
          $exe = Get-ChildItem -Path $installation -Recurse -Filter '*.exe' | Where-Object { $_.Name -notmatch '^uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed 0.7 executable not found' }
          $before = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "Installed previous version: $($exe.FullName)"
          $upgrade = Start-Process -FilePath $new -ArgumentList @('/P','/UPDATE','/R') -PassThru
          if (-not $upgrade.WaitForExit(90000)) { throw 'Passive update installer did not finish in 90 seconds' }
          if ($upgrade.ExitCode -ne 0) { throw "Tauri NSIS passive update failed: $($upgrade.ExitCode)" }
          Start-Sleep -Seconds 2
          $after = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if ($before -eq $after) { throw 'Installed binary unchanged after passive update' }
          Write-Host "PASS: released 0.7 upgraded to 0.8 with NSIS passive /P /UPDATE /R"
