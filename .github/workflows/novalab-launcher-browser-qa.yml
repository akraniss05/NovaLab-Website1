name: NovaLab Launcher v0.7 Browser QA (Mobile + Desktop)
on:
  push:
    branches: [main]
    paths:
      - 'launcher/index.html'
      - 'launcher/tests/qa_browser.py'
      - 'launcher/tests/qa_updates.py'
      - 'launcher/tests/qa_launcher_updater.py'
      - 'launcher/tests/qa_deep_browser.py'
      - 'launcher/tests/qa_backend_permissions.py'
      - 'launcher/tests/qa_session_offline.py'
      - 'launcher/tests/qa_import_safety.py'
      - 'launcher/tests/qa_live_assets.py'
      - 'launcher/tests/qa_backup_import.py'
      - '.github/workflows/novalab-launcher-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test real signup, login, admin, studio and browser UI
        run: python launcher/tests/qa_browser.py
      - name: Test live catalog updates, install progress, and uninstall with mocked native bridge
        run: python launcher/tests/qa_updates.py
      - name: Test desktop launcher updater UI, checksum feedback and handoff confirmation
        run: python launcher/tests/qa_launcher_updater.py
      - name: Test corrupt local state, UI routes, XSS and offline API scenarios
        run: python launcher/tests/qa_deep_browser.py
      - name: Test session preservation during offline and token-revoked events
        run: python launcher/tests/qa_session_offline.py
      - name: Test backup import corruption and size rejection
        run: python launcher/tests/qa_backup_import.py
      - name: Test live anonymous API permissions (read-only)
        run: python launcher/tests/qa_backend_permissions.py
      - name: Inspect published game assets and ZIP files without modifying data
        run: python launcher/tests/qa_live_assets.py
      - name: Test backup imports and active installation removal
        run: python launcher/tests/qa_import_safety.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaLab-v0.7-Mobile-Desktop-Screenshots
          path: launcher/tests/qa-*.png
          if-no-files-found: ignore
