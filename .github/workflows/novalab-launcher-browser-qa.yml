name: NovaLab Launcher Browser QA (Mobile and Desktop)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/index.html'
      - 'launcher/tests/**'
      - '.github/workflows/novalab-launcher-browser-qa.yml'
permissions:
  contents: read
jobs:
  real-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run real mobile and desktop tests
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/novalab-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python launcher/tests/browser_qa.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaLab-Launcher-v0.3-Chromium-Screenshots
          path: launcher-test-results/
          if-no-files-found: ignore
