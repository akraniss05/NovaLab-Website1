name: NovaLab Launcher v0.4 Browser QA (Mobile + Desktop)
on:
  push:
    branches: [main]
    paths:
      - 'launcher/index.html'
      - 'launcher/tests/qa_browser.py'
      - '.github/workflows/novalab-launcher-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test real signup, login, admin, studio and browser UI
        run: python launcher/tests/qa_browser.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaLab-v0.4-Mobile-Desktop-Screenshots
          path: launcher/tests/qa-*.png
          if-no-files-found: ignore
